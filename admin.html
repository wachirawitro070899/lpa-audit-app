<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - LPA Audit</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{--nav:#7f1d1d;--blue:#dc2626;--bg:#fff7f7;--line:#ead6d6;--muted:#785f5f;--red:#dc2626}*{box-sizing:border-box}body{margin:0;font-family:'Noto Sans Thai',sans-serif;background:var(--bg);color:#2b1717}.nav{min-height:68px;background:linear-gradient(90deg,var(--nav),#b91c1c);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:12px 24px;gap:16px}.wrap{max-width:1320px;margin:auto;padding:24px}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 13px;cursor:pointer;font:inherit}.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.danger{color:var(--red)}.muted{color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0} .card{background:#fff;box-shadow:0 5px 16px rgba(127,29,29,.06);border:1px solid var(--line);border-radius:14px;padding:16px}.card span{display:block;color:var(--muted);font-size:12px}.card b{font-size:25px} .panel{background:#fff;box-shadow:0 5px 16px rgba(127,29,29,.06);border:1px solid var(--line);border-radius:14px;padding:16px}.toolbar{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-bottom:12px}.toolbar input{width:min(430px,100%);height:40px;border:1px solid var(--line);border-radius:8px;padding:0 10px;font:inherit}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:1000px;font-size:12px}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{background:#fee2e2;color:#7f1d1d}.tag{display:inline-block;padding:3px 7px;border-radius:999px;background:#fff1f2}.right{text-align:right}.empty{text-align:center;padding:38px;color:var(--muted)}dialog{width:min(980px,94vw);border:0;border-radius:16px;padding:0;box-shadow:0 30px 80px #0003}dialog::backdrop{background:#0f172a99}.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}.modal-body{padding:18px;max-height:76vh;overflow:auto}.meta-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 16px;margin-bottom:14px}.question{padding:10px 0;border-bottom:1px solid #f3dada}.answer{font-weight:700}.ok{color:#15803d}.observe{color:#b45309}.ng{color:#b91c1c}.na{color:#64748b}@media(max-width:760px){.cards{grid-template-columns:1fr 1fr}.meta-grid{grid-template-columns:1fr}.wrap{padding:12px}.nav{padding:12px}.toolbar{align-items:stretch;flex-direction:column}}
 .nav-brand{display:flex;align-items:center;gap:12px}.nav-logo{width:120px;height:40px;object-fit:contain;background:#fff;border-radius:7px;padding:5px}</style><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script><script src="firebase-config.js"></script></head><body><div class="nav"><div class="nav-brand"><img class="nav-logo" src="astemo-logo.png" alt="Astemo"><div><b>LPA ADMIN</b><div style="font-size:11px;color:#cbd5e1">ระบบหลังบ้าน · ต้อง Login</div></div></div><div class="actions"><button class="btn" onclick="location.href='audit.html'">เปิดหน้ากรอกข้อมูล</button><button class="btn" id="logout">ออกจากระบบ</button></div></div><main class="wrap"><h1 style="margin-bottom:3px">รายการ Process Audit</h1><p class="muted" id="who">กำลังตรวจสอบสิทธิ์...</p><div class="cards"><div class="card"><span>รายการทั้งหมด</span><b id="cTotal">0</b></div><div class="card"><span>OK รวม</span><b id="cOk">0</b></div><div class="card"><span>Observation รวม</span><b id="cObs">0</b></div><div class="card"><span>NG รวม</span><b id="cNg">0</b></div></div><section class="panel"><div class="toolbar"><input id="search" placeholder="ค้นหา Audit No., หน่วยงาน, Line, Auditor"><button class="btn primary" id="refresh">รีเฟรช</button></div><div class="table-wrap"><table><thead><tr><th>วันเวลาที่ส่ง</th><th>Audit No.</th><th>วันที่ Audit</th><th>หน่วยงาน</th><th>Line / Area</th><th>Level</th><th>Auditor</th><th>ผล</th><th class="right">จัดการ</th></tr></thead><tbody id="rows"></tbody></table></div><div id="empty" class="empty" hidden>ยังไม่มีข้อมูล Audit</div></section></main>
<dialog id="detail"><div class="modal-head"><b id="detailTitle">Audit detail</b><button class="btn" onclick="detail.close()">ปิด</button></div><div class="modal-body" id="detailBody"></div></dialog>
<script>
let items=[];
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fmtDate(s){try{return new Intl.DateTimeFormat('th-TH',{dateStyle:'medium',timeStyle:'short'}).format(new Date(s))}catch{return s||'-'}}
function requireAdmin(){if(sessionStorage.getItem('lpa_admin')!=='1'){location.replace('login.html');throw new Error('Unauthorized')}}
function db(){if(!window.firebase)throw new Error('โหลด Firebase ไม่สำเร็จ');if(!firebase.apps.length)firebase.initializeApp(window.LPA_FIREBASE_CONFIG);return firebase.database()}
async function boot(){requireAdmin();document.getElementById('who').textContent='เข้าสู่ระบบโดย Kittiya';await load()}
async function load(){requireAdmin();const snap=await db().ref('lpaAudits').once('value');items=Object.entries(snap.val()||{}).map(([id,x])=>({...x,id:x.id||id})).sort((a,b)=>String(b.createdAt||'').localeCompare(String(a.createdAt||'')));render()}
function auditScore(x){if(Number.isFinite(Number(x.summary?.scorePercent)))return Number(x.summary.scorePercent);const ok=Number(x.summary?.ok||0),observe=Number(x.summary?.observe||0),ng=Number(x.summary?.ng||0),scored=ok+observe+ng;return scored?Math.round(((ok*2+observe)/(scored*2))*1000)/10:0}
function render(){const q=search.value.trim().toLowerCase();const list=items.filter(x=>[x.meta.auditNo,x.meta.unit,x.meta.line,x.meta.level,x.meta.auditor,x.meta.auditee].join(' ').toLowerCase().includes(q));rows.innerHTML=list.map(x=>`<tr><td>${esc(fmtDate(x.createdAt))}</td><td><b>${esc(x.meta.auditNo)}</b></td><td>${esc(x.meta.auditDate)}</td><td>${esc(x.meta.unit)}</td><td>${esc(x.meta.line)}</td><td>${esc(x.meta.level)}</td><td>${esc(x.meta.auditor)}</td><td><b style="color:#b91c1c">${auditScore(x).toFixed(1)}%</b><br><span class="tag">😊 ${x.summary?.ok||0} · 😐 ${x.summary?.observe||0} · 😒 ${x.summary?.ng||0}</span></td><td class="right"><button class="btn" onclick="viewAudit('${x.id}')">ดู</button> <button class="btn danger" onclick="removeAudit('${x.id}','${esc(x.meta.auditNo)}')">ลบ</button></td></tr>`).join('');empty.hidden=list.length>0;cTotal.textContent=items.length;cOk.textContent=items.reduce((n,x)=>n+(x.summary?.ok||0),0);cObs.textContent=items.reduce((n,x)=>n+(x.summary?.observe||0),0);cNg.textContent=items.reduce((n,x)=>n+(x.summary?.ng||0),0)}
async function viewAudit(id){requireAdmin();const x=items.find(row=>row.id===id);if(!x)return alert('ไม่พบข้อมูล');detailTitle.textContent=`${x.meta.auditNo} · ${auditScore(x).toFixed(1)}%`;const labels={ok:'😊 OK',observe:'😐 Observation',ng:'😒 NG',na:'N/A'};const allIds=Array.from(new Set([...Object.keys(x.state?.answers||{}),...Object.keys(x.state?.comments||{}),...Object.keys(x.state?.images||{}),...Object.keys(x.state?.questions||{}),...Object.keys(x.state?.custom||{})])).sort((a,b)=>Number(a.slice(1))-Number(b.slice(1)));detailBody.innerHTML=`<div class="meta-grid"><div><b>วันที่ Audit</b><br>${esc(x.meta.auditDate)}</div><div><b>หน่วยงาน</b><br>${esc(x.meta.unit)}</div><div><b>Line / Area</b><br>${esc(x.meta.line)}</div><div><b>Level</b><br>${esc(x.meta.level)}</div><div><b>Auditor</b><br>${esc(x.meta.auditor)}</div><div><b>Auditee</b><br>${esc(x.meta.auditee||'-')}</div><div><b>คะแนนรวม</b><br><b style="color:#b91c1c">${auditScore(x).toFixed(1)}%</b></div><div><b>ส่งเมื่อ</b><br>${esc(fmtDate(x.createdAt))}</div></div>`+allIds.map(id=>{const a=x.state.answers?.[id]||'';const q=x.state.questions?.[id]||x.state.custom?.[id]||id;const image=x.state.images?.[id];return `<div class="question"><div>${esc(q)}</div><div class="answer ${esc(a)}">${esc(labels[a]||'ยังไม่ตอบ')}</div>${x.state.comments?.[id]?`<div class="muted">Comment: ${esc(x.state.comments[id])}</div>`:''}${image?`<img src="${image}" alt="รูปหลักฐาน" style="display:block;max-width:280px;max-height:220px;margin-top:8px;border-radius:8px;border:1px solid #dfe6ef;object-fit:contain">`:''}</div>`}).join('');detail.showModal()}
async function removeAudit(id,no){requireAdmin();if(!confirm(`ลบข้อมูล ${no} ?`))return;await db().ref('lpaAudits/'+id).remove();await load()}
search.addEventListener('input',render);refresh.onclick=()=>load().catch(e=>alert(e.message));logout.onclick=()=>{sessionStorage.removeItem('lpa_admin');sessionStorage.removeItem('lpa_admin_name');location.replace('login.html')};boot().catch(e=>{console.error(e);if(e.message!=='Unauthorized')alert('โหลดข้อมูลไม่สำเร็จ: '+e.message)});
</script></body></html>
