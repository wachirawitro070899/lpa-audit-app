name: Apply LPA audit page update

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-lpa-1-3.yml
      - tools/apply_lpa_fix.py

permissions:
  contents: write

jobs:
  update-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Apply audit page changes
        run: python3 tools/apply_lpa_fix.py
      - name: Commit audit page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit.html
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "Fix LPA input page scoring and evaluation rating"
          git push
