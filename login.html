<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login - LPA Audit</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--nav:#0d233f;--blue:#2563eb;--bg:#eef3f8;--text:#182230;--muted:#64748b;--line:#dfe6ef;--red:#dc2626}*{box-sizing:border-box}body{margin:0;font-family:'Noto Sans Thai',sans-serif;background:linear-gradient(135deg,#eaf1f8,#f8fafc);color:var(--text);min-height:100vh;display:grid;place-items:center;padding:20px}.shell{width:min(920px,100%);display:grid;grid-template-columns:1.1fr .9fr;background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 24px 60px rgba(15,23,42,.12)}.hero{background:linear-gradient(145deg,var(--nav),#174f82);color:#fff;padding:52px}.hero h1{font-size:35px;line-height:1.15;margin:0 0 12px}.hero p{color:#cbd5e1;line-height:1.8}.badge{display:inline-block;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:6px 10px;font-size:12px;margin-bottom:26px}.login{padding:48px 40px}.login h2{margin:0 0 4px;font-size:26px}.sub{color:var(--muted);font-size:13px;margin-bottom:26px}.field{margin-bottom:14px}.field label{display:block;font-size:12px;font-weight:600;margin-bottom:6px}.field input{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font:inherit}.field input:focus{outline:2px solid #bfdbfe;border-color:#60a5fa}.btn{width:100%;height:44px;border:0;border-radius:10px;background:var(--blue);color:#fff;font:inherit;font-weight:600;cursor:pointer;margin-top:6px}.err{min-height:22px;color:var(--red);font-size:12px;margin-top:10px}.demo{margin-top:22px;padding:12px;border-radius:10px;background:#f8fafc;color:#475569;font-size:11px;line-height:1.7}@media(max-width:720px){.shell{grid-template-columns:1fr}.hero{padding:30px}.hero h1{font-size:27px}.login{padding:30px}}
</style></head>
<body><div class="shell"><section class="hero"><img src="astemo-logo.png" alt="Astemo" style="display:block;width:190px;height:65px;object-fit:contain;background:#fff;border-radius:10px;padding:8px;margin-bottom:24px"><div class="badge">Astemo · Layered Process Audit</div><h1>เข้าสู่ระบบ<br>LPA Audit</h1><p>ระบบ Login นี้ใช้สำหรับเจ้าหน้าที่ Admin เพื่อเข้าระบบหลังบ้าน ส่วนพนักงานใช้เฉพาะหน้ากรอก Audit</p></section><section class="login"><h2>Admin Login</h2><div class="sub">กรอกชื่อผู้ใช้และรหัสผ่านของผู้ดูแลระบบ</div><form id="loginForm"><div class="field"><label>Username</label><input id="username" value="Kittiya" autocomplete="username" required autofocus></div><div class="field"><label>Password</label><input id="password" type="password" inputmode="numeric" autocomplete="current-password" required></div><button class="btn" type="submit">เข้าสู่ระบบหลังบ้าน</button><div class="err" id="err"></div></form><div class="demo">หน้านี้สำหรับเจ้าหน้าที่ Admin เท่านั้น</div></section></div>
<script>
if(sessionStorage.getItem('lpa_admin')==='1')location.replace('admin.html');
async function sha256(value){const bytes=new TextEncoder().encode(value);const hash=await crypto.subtle.digest('SHA-256',bytes);return [...new Uint8Array(hash)].map(x=>x.toString(16).padStart(2,'0')).join('')}
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const err=document.getElementById('err');err.textContent='';const btn=e.submitter;btn.disabled=true;try{const user=username.value.trim();const passwordHash=await sha256(password.value);if(user!=='Kittiya'||passwordHash!=='8d969eef6ecad3c29a3a629280e686cf0c3f5d5a86aff3ca12020c923adc6c92')throw new Error('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');sessionStorage.setItem('lpa_admin','1');sessionStorage.setItem('lpa_admin_name','Kittiya');location.replace('admin.html')}catch(x){err.textContent=x.message}finally{btn.disabled=false}})
</script></body></html>
