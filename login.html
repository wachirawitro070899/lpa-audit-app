<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login - LPA Audit</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--nav:#7f1d1d;--blue:#dc2626;--bg:#fff7f7;--text:#2b1717;--muted:#785f5f;--line:#ead6d6;--red:#dc2626}*{box-sizing:border-box}body{margin:0;font-family:'Noto Sans Thai',sans-serif;background:linear-gradient(135deg,#fee2e2,#fffafa);color:var(--text);min-height:100vh;display:grid;place-items:center;padding:20px}.shell{width:min(920px,100%);display:grid;grid-template-columns:1.1fr .9fr;background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 24px 60px rgba(127,29,29,.14)}.hero{background:linear-gradient(145deg,var(--nav),#b91c1c);color:#fff;padding:52px}.hero h1{font-size:35px;line-height:1.15;margin:0 0 12px}.hero p{color:#fee2e2;line-height:1.8}.badge{display:inline-block;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:6px 10px;font-size:12px;margin-bottom:26px}.login{padding:48px 40px}.login h2{margin:0 0 4px;font-size:26px}.sub{color:var(--muted);font-size:13px;margin-bottom:26px}.field{margin-bottom:14px}.field label{display:block;font-size:12px;font-weight:600;margin-bottom:6px}.field input{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font:inherit}.field input:focus{outline:2px solid #fecaca;border-color:#ef4444}.btn{width:100%;height:44px;border:0;border-radius:10px;background:var(--blue);color:#fff;font:inherit;font-weight:600;cursor:pointer;margin-top:6px}.err{min-height:22px;color:var(--red);font-size:12px;margin-top:10px}.demo{margin-top:22px;padding:12px;border-radius:10px;background:#fff5f5;color:#6b3030;font-size:11px;line-height:1.7}@media(max-width:720px){.shell{grid-template-columns:1fr}.hero{padding:30px}.hero h1{font-size:27px}.login{padding:30px}}.password-wrap{position:relative}.password-wrap input{padding-right:48px}.password-toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:36px;height:34px;border:0;background:transparent;color:#7f1d1d;font-size:19px;cursor:pointer;border-radius:7px}.password-toggle:hover{background:#fee2e2}
</style></head>
<body><div class="shell"><section class="hero"><img src="astemo-logo.png" alt="Astemo" style="display:block;width:190px;height:65px;object-fit:contain;background:#fff;border-radius:10px;padding:8px;margin-bottom:24px"><div class="badge">Astemo · Layered Process Audit</div><h1>เข้าสู่ระบบ<br>LPA Audit</h1><p>ระบบ Login นี้ใช้สำหรับเจ้าหน้าที่ Admin เพื่อเข้าระบบหลังบ้าน ส่วนพนักงานใช้เฉพาะหน้ากรอก Audit</p></section><section class="login"><h2>Login เข้าระบบ</h2><div class="sub">กรอกชื่อผู้ใช้และรหัสผ่านของผู้ดูแลระบบ</div><form id="loginForm"><div class="field"><label>Username</label><input id="username" value="Kittiya.thongdee" autocomplete="username" required autofocus></div><div class="field"><label>Password</label><div class="password-wrap"><input id="password" type="password" autocomplete="current-password" required><button class="password-toggle" id="passwordToggle" type="button" aria-label="แสดงรหัสผ่าน" title="แสดงรหัสผ่าน">👁</button></div></div><button class="btn" type="submit">เข้าสู่ระบบ</button><div class="err" id="err"></div></form><div class="demo">หน้านี้สำหรับเจ้าหน้าที่ Admin เท่านั้น</div></section></div>
<script>
if(sessionStorage.getItem('lpa_admin')==='1')location.replace('admin.html');
async function sha256(value){const bytes=new TextEncoder().encode(value);const hash=await crypto.subtle.digest('SHA-256',bytes);return [...new Uint8Array(hash)].map(x=>x.toString(16).padStart(2,'0')).join('')}
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const err=document.getElementById('err');err.textContent='';const btn=e.submitter;btn.disabled=true;try{const user=username.value.trim();const passwordHash=await sha256(password.value.trim());if(user.toLowerCase()!=='kittiya.thongdee'||passwordHash!=='90b84a57f64e0bb53112e42514d22cfaa2b2ef8fba7656208fcd69922beeba98')throw new Error('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');sessionStorage.setItem('lpa_admin','1');sessionStorage.setItem('lpa_admin_name','Kittiya.thongdee');location.replace('admin.html')}catch(x){err.textContent=x.message}finally{btn.disabled=false}})
const passwordToggle=document.getElementById('passwordToggle');passwordToggle.addEventListener('click',()=>{const show=password.type==='password';password.type=show?'text':'password';passwordToggle.textContent=show?'🙈':'👁';passwordToggle.setAttribute('aria-label',show?'ซ่อนรหัสผ่าน':'แสดงรหัสผ่าน');passwordToggle.title=show?'ซ่อนรหัสผ่าน':'แสดงรหัสผ่าน'});
</script></body></html>
